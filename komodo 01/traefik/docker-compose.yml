---
services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    restart: unless-stopped
    environment:
      - TRANSIP_ACCOUNT_NAME=maikelvdb # ← your TransIP username
      - TRANSIP_PRIVATE_KEY_PATH=/transip/private.key
      - TRANSIP_POLLING_INTERVAL=60
      - TRANSIP_PROPAGATION_TIMEOUT=300
      - LEGO_CA_CERTIFICATES=/etc/ssl/certs/ca-certificates.crt
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirect HTTP -> HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=websecure"
      # Let's Encrypt DNS challenge via TransIP
      - "--certificatesresolvers.le.acme.email=maikel@vandenbosch.dev"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.dnschallenge=true"
      - "--certificatesresolvers.le.acme.dnschallenge.provider=transip"
      - "--certificatesresolvers.le.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--certificatesresolvers.le.acme.dnschallenge.disablepropagationcheck=false"
      - "--certificatesresolvers.le.acme.dnschallenge.delaybeforecheck=120"

      # Enable access log
      - "--log.level=DEBUG"
      - "--accesslog=true"

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
      - /transip:/transip:ro # ← mount your private key here

    labels:
      - "traefik.enable=true"

      # Dashboard router
      - "traefik.http.routers.traefik.rule=Host(`traefik.vandenbosch.dev`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=le"

      # Tell router to use internal api service
      - "traefik.http.routers.traefik.service=api@internal"

      # Optional: basic auth middleware
      - "traefik.http.routers.traefik.middlewares=traefik-auth"

      - "traefik.http.middlewares.traefik-auth.basicauth.users=admin:$$apr1$$AOhzuT1Z$$/c4GxPI6Z8O9/sEI4E2QE1"

    networks:
      - proxy

networks:
  proxy:
    external: true
